<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everything World: proposed scenes</title>
<style>
  :root { --bg:#0f1720; --sea:#132232; --panel:#18222e; --ink:#e8edf2; --dim:#93a1b0; --line:#2b3a4a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; }
  #app { display:grid; grid-template-columns: 1fr 360px; height:100vh; }
  #mapwrap { position:relative; overflow:hidden; background:radial-gradient(circle at 50% 40%, #183048, var(--sea) 70%); }
  svg { width:100%; height:100%; cursor:grab; display:block; }
  svg.drag { cursor:grabbing; }
  .scene circle.land { stroke:rgba(255,255,255,.35); stroke-width:.6; cursor:pointer; }
  .scene.sel circle.land { stroke:#fff; stroke-width:1.6; }
  .scene.nb circle.land { stroke:#ffd76a; stroke-width:1.4; }
  .scene.dim { opacity:.35; }
  .adot { fill:rgba(255,255,255,.75); pointer-events:none; }
  .lbl { fill:#fff; font-weight:600; text-anchor:middle; pointer-events:none; paint-order:stroke; stroke:rgba(0,0,0,.65); stroke-width:2.2px; stroke-linejoin:round; }
  .rlbl { fill:rgba(255,255,255,.55); font-weight:700; letter-spacing:.12em; text-transform:uppercase; text-anchor:middle; pointer-events:none; }
  .link { stroke:#ffd76a; stroke-width:.8; stroke-dasharray:2 2; fill:none; pointer-events:none; }
  aside { background:var(--panel); border-left:1px solid var(--line); overflow:auto; padding:16px 18px 40px; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:16px; margin:18px 0 6px; }
  h3 { font-size:12px; margin:16px 0 6px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; }
  p { margin:6px 0; color:var(--dim); }
  .score { display:flex; gap:8px; margin:10px 0; }
  .score div { flex:1; background:#101821; border:1px solid var(--line); border-radius:8px; padding:8px; text-align:center; }
  .score b { display:block; font-size:18px; color:var(--ink); }
  input[type=search] { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#101821; color:var(--ink); font-size:14px; }
  .tags span { display:inline-block; background:#223142; border-radius:12px; padding:2px 9px; margin:2px 3px 2px 0; font-size:12px; }
  .bar { display:grid; grid-template-columns:96px 1fr 38px; align-items:center; gap:6px; font-size:12px; color:var(--dim); margin:3px 0; }
  .bar i { display:block; height:7px; border-radius:4px; background:#2a3a4c; position:relative; }
  .bar i b { position:absolute; inset:0 auto 0 0; border-radius:4px; background:#7fb2e5; }
  ul { list-style:none; padding:0; margin:0; }
  li.art { padding:3px 0; border-bottom:1px solid #1f2b38; display:flex; justify-content:space-between; gap:8px; cursor:pointer; }
  li.art:hover { color:#fff; }
  li.art small { color:var(--dim); }
  li.art .songs { display:none; width:100%; color:var(--dim); font-size:12px; padding:2px 0 4px 10px; }
  li.art.open { flex-wrap:wrap; }
  li.art.open .songs { display:block; }
  a.nb { color:#ffd76a; cursor:pointer; text-decoration:none; display:block; padding:2px 0; }
  a.nb:hover { text-decoration:underline; }
  .realmkey { display:flex; flex-wrap:wrap; gap:4px 10px; font-size:12px; color:var(--dim); margin-top:8px; }
  .realmkey span::before { content:''; display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--c); margin-right:5px; vertical-align:-1px; }
  .hint { position:absolute; left:12px; bottom:10px; color:rgba(255,255,255,.6); font-size:12px; }
  .results li { padding:3px 0; cursor:pointer; } .results li:hover { color:#fff; }
  @media (max-width: 800px) { #app { grid-template-columns:1fr; grid-template-rows:55vh 45vh; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<div id="app">
  <div id="mapwrap">
    <svg id="map"></svg>
    <div class="hint">Scroll to zoom, drag to move, click a scene</div>
  </div>
  <aside id="side"></aside>
</div>
<script src="data.js"></script>
<script>
const D = window.SCENES;
const COLORS = ['#c96f4a','#8e6bbf','#4f9d8f','#4a86c9','#d0a23c','#b65a8a','#6f9d4a','#7d8794','#c9584a','#4ab0c9'];
const svg = document.getElementById('map'), side = document.getElementById('side');
const NS = 'http://www.w3.org/2000/svg';
const el = (t, a = {}, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (p) p.appendChild(e); return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const label = s => s.tags.slice(0, 2).map(t => t.replace(/^region:/, '')).join(' · ') || 'Unknown';
const realmName = r => {
  // the tag that best sums up the realm: weighted by scene size and how high it ranks in each scene
  const score = {};
  for (const k of D.realms[r].scenes) {
    const s = D.scenes[k];
    s.tags.slice(0, 4).forEach((t, i) => { if (!t.startsWith('region:')) score[t] = (score[t] || 0) + s.songs / (i + 1); });
  }
  return Object.entries(score).sort((a, b) => b[1] - a[1])[0]?.[0] || 'realm ' + r;
};
const songsBy = {};
for (const [t, a, uri] of D.songs) (songsBy[a] = songsBy[a] || []).push([t, uri]);
const artistsOf = k => Object.entries(D.artists).filter(([, v]) => v.scene === k).sort((a, b) => b[1].songs - a[1].songs);

// ---- draw ----
const xs = D.scenes.flatMap(s => [s.x - s.r, s.x + s.r]), ys = D.scenes.flatMap(s => [s.y - s.r, s.y + s.r]);
const bx = Math.min(...xs) - 20, by = Math.min(...ys) - 20, bw = Math.max(...xs) - bx + 20, bh = Math.max(...ys) - by + 20;
let vb = { x: bx, y: by, w: bw, h: bh };
const setVB = () => svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
setVB();
const gLinks = el('g', {}, svg), gScenes = el('g', {}, svg), gRealm = el('g', {}, svg);

const nodes = D.scenes.map((s, k) => {
  const g = el('g', { class: 'scene' }, gScenes);
  el('circle', { class: 'land', cx: s.x, cy: s.y, r: s.r, fill: COLORS[s.realm % COLORS.length] }, g);
  for (const [, a] of artistsOf(k)) el('circle', { class: 'adot', cx: a.x, cy: a.y, r: .35 + Math.sqrt(a.songs) * .25 }, g);
  const t = el('text', { class: 'lbl', x: s.x, y: s.y + 1, 'font-size': Math.max(2.4, Math.min(5, s.r / 3.2)) }, g);
  t.textContent = label(s);
  g.addEventListener('click', e => { e.stopPropagation(); select(k); });
  return g;
});
D.realms.forEach((r, i) => {
  const ss = r.scenes.map(k => D.scenes[k]);
  const cx = ss.reduce((a, s) => a + s.x * s.songs, 0) / ss.reduce((a, s) => a + s.songs, 0);
  const top = Math.min(...ss.map(s => s.y - s.r));
  const t = el('text', { class: 'rlbl', x: cx, y: top - 4, 'font-size': 6 }, gRealm);
  t.textContent = realmName(i);
});

// ---- pan & zoom ----
let drag = null;
svg.addEventListener('mousedown', e => { drag = { x: e.clientX, y: e.clientY, vb: { ...vb }, moved: false }; svg.classList.add('drag'); });
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const s = vb.w / svg.clientWidth;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) drag.moved = true;
  vb.x = drag.vb.x - (e.clientX - drag.x) * s; vb.y = drag.vb.y - (e.clientY - drag.y) * s; setVB();
});
window.addEventListener('mouseup', () => { drag = null; svg.classList.remove('drag'); });
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect(), f = Math.exp(e.deltaY * .0015);
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const nw = Math.min(bw * 3, Math.max(15, vb.w * f)), k = nw / vb.w;
  vb = { x: p.x - (p.x - vb.x) * k, y: p.y - (p.y - vb.y) * k, w: nw, h: vb.h * k }; setVB();
}, { passive: false });
svg.addEventListener('click', () => { if (!drag || !drag.moved) overview(); });

function flyTo(s) {
  const w = Math.max(s.r * 5, 60), h = w * svg.clientHeight / svg.clientWidth;
  vb = { x: s.x - w / 2, y: s.y - h / 2, w, h }; setVB();
}

// ---- side panel ----
function overview() {
  nodes.forEach(n => n.classList.remove('sel', 'nb', 'dim')); gLinks.innerHTML = '';
  const sc = D.score;
  side.innerHTML = `
    <h1>Everything World: proposed scenes</h1>
    <p>${D.scenes.length} scenes in ${D.realms.length} realms, from ${Object.keys(D.artists).length} artists and ${D.songs.length} songs.
    Each circle is a scene, sized by song count. Dots are artists. Colours are realms (island chains).
    An artist's songs always stay together. Labels are just the top tags for now; real names come later.</p>
    <h3>How alike are map neighbours?</h3>
    <div class="score"><div><b>${sc.new}</b>new map</div><div><b>${sc.old ?? '–'}</b>old map</div><div><b>${sc.random}</b>random</div></div>
    <p>Average similarity between each artist and its 5 nearest artists on the map (0 = nothing in common, 1 = identical).</p>
    <h3>Search</h3>
    <input type="search" id="q" placeholder="Artist, song or tag">
    <ul class="results" id="res"></ul>
    <h3>Realms</h3>
    <div class="realmkey">${D.realms.map((r, i) => `<span style="--c:${COLORS[i % COLORS.length]}">${esc(realmName(i))} (${r.scenes.length})</span>`).join('')}</div>
    <h3>All scenes</h3>
    <ul>${D.scenes.map((s, k) => [s, k]).sort((a, b) => a[0].realm - b[0].realm || b[0].songs - a[0].songs)
      .map(([s, k]) => `<li class="art" data-k="${k}"><span>${esc(label(s))}</span><small>${s.songs} songs</small></li>`).join('')}</ul>`;
  side.querySelectorAll('li[data-k]').forEach(li => li.onclick = () => select(+li.dataset.k, true));
  const q = side.querySelector('#q'), res = side.querySelector('#res');
  q.oninput = () => {
    const v = q.value.trim().toLowerCase(); res.innerHTML = '';
    if (v.length < 2) return;
    const hits = [];
    for (const [a, info] of Object.entries(D.artists)) if (a.toLowerCase().includes(v)) hits.push([`${a}`, info.scene]);
    for (const [t, a] of D.songs) if (t.toLowerCase().includes(v)) hits.push([`${t} · ${a}`, D.artists[a]?.scene]);
    D.scenes.forEach((s, k) => { if (s.tags.some(t => t.includes(v))) hits.push([`Scene: ${label(s)}`, k]); });
    res.innerHTML = hits.slice(0, 30).map(([t, k]) => `<li data-k="${k}">${esc(t)} <small style="color:var(--dim)">→ ${esc(label(D.scenes[k]))}</small></li>`).join('');
    res.querySelectorAll('li').forEach(li => li.onclick = () => select(+li.dataset.k, true));
  };
}

function select(k, fly) {
  const s = D.scenes[k];
  nodes.forEach((n, i) => { n.classList.toggle('sel', i === k); n.classList.toggle('nb', s.neighbours.includes(i)); n.classList.toggle('dim', i !== k && !s.neighbours.includes(i)); });
  gLinks.innerHTML = '';
  for (const j of s.neighbours) { const t = D.scenes[j]; el('line', { class: 'link', x1: s.x, y1: s.y, x2: t.x, y2: t.y }, gLinks); }
  if (fly) flyTo(s);
  const snd = s.sound, bars = [['energy', snd.energy], ['acousticness', snd.acousticness], ['happiness', snd.valence], ['danceability', snd.danceability]];
  const arts = artistsOf(k);
  side.innerHTML = `
    <a class="nb" id="back">← All scenes</a>
    <h2>${esc(label(s))}</h2>
    <p>${s.songs} songs · ${arts.length} artists · realm: ${esc(realmName(s.realm))} · ${Math.round(snd.tempo)} bpm average</p>
    <div class="tags">${s.tags.map(t => `<span>${esc(t.replace(/^region:/, 'old map: '))}</span>`).join('')}</div>
    <h3>Sound</h3>
    ${bars.map(([n, v]) => `<div class="bar">${n}<i><b style="width:${Math.round(v * 100)}%"></b></i>${Math.round(v * 100)}%</div>`).join('')}
    <h3>Most similar scenes</h3>
    ${s.neighbours.map(j => `<a class="nb" data-k="${j}">${esc(label(D.scenes[j]))}</a>`).join('')}
    <h3>Artists (click for songs)</h3>
    <ul>${arts.map(([a, v]) => `<li class="art"><span>${esc(a)}</span><small>${v.songs}</small>
      <div class="songs">${(songsBy[a] || []).map(([t]) => esc(t)).join('<br>')}</div></li>`).join('')}</ul>`;
  side.querySelector('#back').onclick = overview;
  side.querySelectorAll('a.nb[data-k]').forEach(a => a.onclick = () => select(+a.dataset.k, true));
  side.querySelectorAll('li.art').forEach(li => li.onclick = () => li.classList.toggle('open'));
}
overview();
</script>
</body>
</html>
